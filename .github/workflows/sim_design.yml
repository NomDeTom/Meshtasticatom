# The three-axis cross: what the archive is configured as, against what else could be spent instead,
# on each of the meshes the round is run over. `sfpp.design` holds the grid; this runs it.
#
# Separate from the two sweeps because it asks a different question. `sim_sweep_blocks` moves one
# flag at a time with the archive switched on in every cell, so it answers "what does this variable
# do to a mesh" and cannot answer "what is the archive worth" - the archive is never off. This
# workflow puts the archive on one axis, everything that could be deployed instead of it on another,
# and the mesh on a third, so every difference is read against the same mesh at the same seed.
#
# One job per (mesh, rival, seed): the archive's ten configurations at one seed, run in sequence.
# That is the smallest unit the cross can be cut into, and the cut is where it is because the ten
# archive configurations are what a cell is a difference *across* - split those over runners and a
# cell's control comes from a different draw than the arms it is subtracted from. Seeds are safe to
# split because each is an independent draw already.
#
# The cut is not free - a job per seed is three times the checkout and setup - and it is here
# because of a measurement. On this tree a 24-hour Batumi run is 128 s and the mirrored mesh is
# 511 s, four times over for four times the nodes. A whole mirrored cell at three seeds is thirty
# of those, about 4.3 hours before any allowance for a slower runner, against GitHub's six-hour job
# ceiling. Per seed it is 85 minutes, which leaves room for a runner half this speed.
#
# Those two figures are 24-hour runs and the cross now runs 72 (see design.TRAFFIC for why). Scaling
# the simulated part - the link build is paid once per run either way - the mirrored mesh comes to
# roughly 1450 s a run and a per-seed job of ten archive configurations to about 4 hours. Hence the
# raised ceiling below. These are extrapolations from a 24-hour measurement, not measurements: the
# collate job now compares each block's seconds-per-simulated-hour against its own history, so the
# first real 72-hour round is what should correct them.
name: Sim Design (cross)

on:
  schedule:
    # Daily at 04:40 UTC, one **mesh** per day. Weekly-over-every-mesh was one 182-job batch that
    # produced nothing until it finished and left six days idle; a mesh a day is 39 jobs (117 for the
    # mirrored one) and lands a digest every morning. The mesh axis is the outer coordinate precisely
    # so a round can be cut this way.
    #
    # **Which mesh is decided by what the archive already holds, not by the date.** A date-keyed
    # rotation marches on regardless, so a day that fails leaves its mesh missing for five days and
    # nothing notices. Each firing instead picks the mesh whose cells have gone longest without a
    # digest - and a mesh with one cell missing outranks a merely older one, since the missing cell is
    # the gap worth closing. See sfpp/nextup.py. Dispatch with `mesh` to override.
    #
    # An hour later than it reads in the history, and the hour is the point: this and
    # sim_sweep_matrix both used to fire at 03:40 on Sunday. Each file's comment reasoned only about
    # the *nightly* block sweep and concluded 03:40 was clear of it; neither mentioned the other
    # Sunday workflow at the same minute. Between them they can ask for 18 concurrent runners, and
    # both are `cancel-in-progress: false`, so the loser does not get dropped - it queues, and burns
    # part of its own `timeout-minutes` before its first line of work.
    - cron: 40 4 * * 0
  workflow_dispatch:
    inputs:
      mesh:
        description: Which mesh's cells to run. `rotate` picks the stalest; `all` is every mesh at once
        type: choice
        required: false
        default: rotate
        options: [rotate, all, batumi, batumi-x4, batumi-legacy-25, batumi-legacy-50, batumi-short-fast]
      rivals:
        description: Space-separated rival names. Empty means every rival the design declares
        type: string
        required: false
        default: ""
      seed_base:
        description: Replay an earlier round by giving its seed base. Empty draws a new one
        type: string
        required: false
        default: ""
      seed_count:
        description: Seeds per cell. Every cell in the round uses the same ones
        type: string
        required: false
        # Two, not three, because the **scheduled** round uses this default over every mesh and the
        # mirrored cells are now split three ways: all five meshes at three seeds is 273 jobs, past the
        # 256 a matrix may hold, and the plan would fail every Sunday. Two is 182 and fits.
        #
        # Seeds accumulate across weeks - the archive is cumulative and the digest averages over
        # whatever it holds - which is the same reasoning sim_sweep_blocks gives for defaulting to one:
        # "One is the nightly default; the archive accumulates the rest". A three-seed round is still
        # available on demand, one mesh at a time via the `mesh` input.
        default: "2"

permissions: {}

# One round at a time, for the same reason the sweeps take one each: two rounds would both push a
# directory to the results branch and the second would spend its collate job resolving a conflict.
concurrency:
  group: sim-design
  cancel-in-progress: false

jobs:
  plan:
    name: Draw the round
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.draw.outputs.matrix }}
      cells: ${{ steps.draw.outputs.cells }}
      seed_base: ${{ steps.draw.outputs.seed_base }}
      run_id: ${{ steps.draw.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the archive, so the plan can see what has already run
        # Shallow and read-only. Absent on the very first run of a fresh repository, which is not an
        # error - an empty archive simply means nothing has run and everything is equally stale.
        run: |
          set -euo pipefail
          mkdir -p archive
          if git fetch --depth 1 origin sim-results 2>/dev/null; then
            git --work-tree=archive checkout FETCH_HEAD -- runs 2>/dev/null || true
            echo "archive holds $(find archive -name summary.json | wc -l) digest(s)"
          else
            echo "no sim-results branch yet - treating every mesh as never run"
          fi

      - name: Draw a seed base and the cell list
        id: draw
        shell: bash
        # Dispatch inputs are free text and reach python through the environment only, never spliced
        # into a shell or a python source line.
        env:
          IN_MESH: ${{ inputs.mesh }}
          IN_RIVALS: ${{ inputs.rivals }}
          IN_SEED_BASE: ${{ inputs.seed_base }}
          IN_SEED_COUNT: ${{ inputs.seed_count }}
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import datetime, json, os, secrets, sys
          from sfpp.design import MESHES, RIVALS, cells, shards_for

          known = cells()
          meshes = [m for m, _ in MESHES]
          rivals = [r for r, _ in RIVALS]

          asked_mesh = (os.environ.get("IN_MESH") or "rotate").strip() or "rotate"
          if asked_mesh not in ("rotate", "all", *meshes):
              sys.exit(f"unknown mesh {asked_mesh!r}; have rotate, all, {', '.join(meshes)}")
          if asked_mesh == "rotate":
              # The mesh that has gone longest without a digest. This is the check that makes the
              # chain self-healing: a mesh whose run failed still has no digest for those cells, so the
              # next firing picks it again rather than moving on to the next mesh in a calendar.
              from sfpp.nextup import design_parts

              asked_mesh = design_parts("archive/runs", 1)[0]
              print(f"stalest mesh: {asked_mesh}", file=sys.stderr)

          asked_rivals = (os.environ.get("IN_RIVALS") or "").split()
          unknown = [r for r in asked_rivals if r not in rivals]
          if unknown:
              sys.exit(f"unknown rival(s): {', '.join(unknown)}")
          want_rivals = asked_rivals or rivals

          chosen = [
              name
              for name, (mesh, _, rival, _) in known.items()
              if asked_mesh in ("all", mesh) and rival in want_rivals
          ]
          if not chosen:
              sys.exit("that mesh and rival selection is empty")

          # One seed base for the whole round, so every cell in it saw the same draw and the round
          # replays from a single number. Cells drawing their own would make the mesh axis
          # incomparable - the point of holding the geometry is holding the draw with it.
          seed_base = (os.environ.get("IN_SEED_BASE") or "").strip()
          if not seed_base:
              seed_base = str(secrets.randbelow(9_000_000) + 1_000_000)
          if not seed_base.isdigit():
              sys.exit(f"seed base must be a number, got {seed_base!r}")

          count = (os.environ.get("IN_SEED_COUNT") or "3").strip()
          if not count.isdigit() or not 1 <= int(count) <= 10:
              sys.exit(f"seed count must be 1-10, got {count!r}")
          seeds = [int(seed_base) + i for i in range(int(count))]

          # One entry per (cell, seed, shard). `cells` stays the cell names alone: that is what the
          # digest is checked against, and a shard is not a block - every shard of a cell carries the
          # same `block` and they are collated as one.
          #
          # The mirrored mesh is split across three jobs. Measured on a runner: ten archive
          # configurations at 72 h is 141 min unmirrored and about 444 mirrored, and 444 is past the
          # platform's own 360-minute hard limit, so this is not a timeout that could have been
          # raised. Splitting is sound because placement now draws from its own stream - see
          # design.SHARDS_BY_MESH.
          jobs = [
              {"cell": c, "seed": sd, "shard": f"{i}/{n}", "tag": f"s{sd}-{i}"}
              for c in chosen
              for sd in seeds
              for n in [shards_for(known[c][0])]
              for i in range(n)
          ]
          if len(jobs) > 256:
              sys.exit(f"{len(jobs)} jobs exceeds the 256 a matrix may hold. A full round over every "
                       f"mesh no longer fits in one dispatch now the mirrored cells are sharded: run "
                       f"it one mesh at a time with the `mesh` input, which is what the mesh axis is "
                       f"the outer coordinate for.")

          print(f"matrix={json.dumps(jobs)}")
          print(f"cells={' '.join(chosen)}")
          print(f"seed_base={seed_base}")
          print(f"run_id=design-{datetime.date.today().isoformat()}-{seed_base}")
          PY
          cat "$GITHUB_OUTPUT"

  cross:
    name: ${{ matrix.cell }} @${{ matrix.seed }} ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Measured on a real runner rather than extrapolated: ten archive configurations at 72 h took 141
    # minutes on Batumi (846 s a run - 2.4x this tree's own container, which also carries the DM
    # transport, traceroute and admin probes this workflow adds). The mirrored mesh is 3.15x per run,
    # so its configurations are split three ways and every job is now ~140-150 minutes whatever the
    # mesh. 240 leaves room for a runner half this speed and stays clear of the platform's 360-minute
    # hard limit.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Below the account's concurrency allowance, so a round never occupies every runner and
      # leaves another workflow queued behind a couple of hundred simulator jobs.
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Each job gets its own scenario cache. Every cell in a round reads the same Batumi rasters,
      # and two jobs racing to write the same derived CSV is the kind of thing that fails once a
      # month and is never reproducible.
      SFPP_SCENARIO_CACHE: ${{ github.workspace }}/.cache/${{ matrix.cell }}-${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PyYAML only, for the packaged scenarios - Batumi is one, so this is not optional here.
      # Charts are the sole other dependency and a round in CI has nobody watching them, so
      # matplotlib is left out and the runs skip them.
      - name: Install the scenario loader
        run: pip install --quiet "PyYAML>=6.0"

      - name: ${{ matrix.cell }} at seed ${{ matrix.seed }} shard ${{ matrix.shard }}
        env:
          CELL: ${{ matrix.cell }}
          SEED: ${{ matrix.seed }}
          SHARD: ${{ matrix.shard }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          # --tag names the file apart from the cell's other seeds and shards. The reports keep the
          # cell's name, so the digest reads them all as one block.
          python3 -u -m sfpp.design --cell "$CELL" --seeds "$SEED" --shard "$SHARD"             --tag "$TAG" --out out

      - uses: actions/upload-artifact@v4
        if: always() # a shard that failed halfway still wrote the archive configurations it finished
        with:
          name: design-${{ matrix.cell }}-${{ matrix.tag }}
          path: out
          if-no-files-found: warn
          # The raw data: every cell's full report. The results branch gets the digest only, because
          # git keeps every blob it has ever seen and committing the raw round would add several GB
          # a year that no later deletion reclaims. 90 days is the longest a public repository
          # offers, and the window in which a question about one cell can still be answered from the
          # numbers rather than by re-running the round.
          retention-days: 90

  collate:
    name: Collate and publish
    needs: [plan, cross]
    if: ${{ !cancelled() }} # a round where some cells failed is still worth collating - the digest names them
    uses: ./.github/workflows/sim_collate.yml
    permissions:
      contents: write
    with:
      run_id: ${{ needs.plan.outputs.run_id }}
      seed_base: ${{ needs.plan.outputs.seed_base }}
      scenario: batumi
      expect: ${{ needs.plan.outputs.cells }}
      artifact_pattern: design-*
