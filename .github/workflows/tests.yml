name: Tests

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  sfpp:
    name: SF++ transport
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PyYAML and nothing else. terrain.py imports it lazily inside preset_scenario(), so a flat
      # run never touches it and a machine with PyYAML installed system-wide looks stdlib-only -
      # which is exactly how this job first went red, with three errors on the preset path. Charts
      # are the only reason matplotlib is ever wanted and CI never draws them.
      - name: Install the scenario loader
        run: pip install --quiet "PyYAML>=6.0"

      - name: Run the transport suite
        run: python3 -m unittest discover -s sfpp -t . -p 'test_*.py'

      - name: The sketch is the one the firmware would send
        # pinsketch.py is a transcription of the firmware's PinSketch.cpp, and a transcription that
        # has drifted produces sketches no radio would ever put on the air - plausible numbers, and
        # wrong. This compiles the C++ and diffs the two case for case.
        #
        # It runs here at all because the source is vendored: the check needed a firmware checkout,
        # which a runner does not have, so the one thing standing between the simulator and invented
        # wire bytes ran only on a developer's machine and only when remembered. --require, so a
        # tree that cannot run it fails rather than reporting a skip nobody reads.
        run: python3 -m sfpp.check_oracle --require

      - name: A flat run is deterministic
        # The permanent gate. Two runs at one seed with no scenario must be identical in every
        # number: draws are hashed on (seed, constant, window) rather than pulled from a sequential
        # stream, so this holds across adding and removing draws. It has proved a change inert four
        # times in this tree's history, and it is the check that catches what nobody predicted.
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 -m sfpp.campaign --hours 2 --nodes 30 --seed 4242 --protocol sr \
              --no-charts --out "/tmp/det$i/run.json" >/dev/null
          done
          python3 - <<'PY'
          import hashlib, json, sys

          def fingerprint(path):
              report = json.load(open(path))
              report = report[0] if isinstance(report, list) else report
              # Neither of these is something the simulation decided: wall_seconds is how long this
              # runner took, and `out` is where the caller asked for the file. Everything else -
              # every option and every measurement - must match, and comparing the options is half
              # the gate: it proves the two runs were configured identically before their numbers
              # are compared at all.
              report.pop("wall_seconds", None)
              report.get("opts", {}).pop("out", None)
              return hashlib.sha256(
                  json.dumps(report, sort_keys=True).encode()
              ).hexdigest()

          a, b = (fingerprint(f"/tmp/det{i}/run.json") for i in (1, 2))
          print(f"fingerprint {a[:16]}")
          if a != b:
              sys.exit(
                  "two runs at seed 4242 disagree: something in the flat path depends on "
                  "wall-clock, iteration order, or an unseeded draw"
              )
          PY

      - name: The standing gates hold on a smoke run
        # Runs the gates collate applies nightly against a real report, so a change that starts
        # producing an impossible channel utilisation or a scenario with no ground is caught here
        # rather than by the next scheduled sweep.
        run: |
          set -euo pipefail
          python3 -m sfpp.sweep --block SF-signed --seeds 1 --seed-base 4242 \
            --grid "--scenario ridge" --out /tmp/smoke >/dev/null
          python3 -m sfpp.collate --runs /tmp/smoke --out /tmp/smoke --run-id ci-smoke \
            --scenario ridge --fail-on-gate
          head -c 200000 /tmp/smoke/trend.md >> "$GITHUB_STEP_SUMMARY"
